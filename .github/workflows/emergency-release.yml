# Emergency Release + LinkedIn Post
#
# ONE-CLICK manual trigger from GitHub Actions UI.
# Use when the scheduled pipeline missed a release.
#
# Go to: Actions → "🚨 Emergency Release" → Run workflow → Run
#
# This will:
#   1. Release the next pending episode (regardless of release_date)
#   2. Wait for GitHub Pages to deploy
#   3. Post to LinkedIn immediately

name: "\U0001F6A8 Emergency Release"

on:
  workflow_dispatch:

permissions:
  contents: write
  issues: write

jobs:
  release-and-post:
    runs-on: ubuntu-latest
    steps:
      - name: Trigger release (force mode)
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        run: |
          echo "Triggering Scheduled Release with force=true..."
          gh workflow run scheduled-release.yml \
            --repo ${{ github.repository }} \
            -f force=true
          echo "Release dispatched. Waiting 30s for it to start..."
          sleep 30

      - name: Wait for release to complete
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        run: |
          echo "Polling Scheduled Release workflow..."
          for i in $(seq 1 40); do
            RUN=$(gh run list --repo ${{ github.repository }} \
              --workflow=scheduled-release.yml \
              --limit=1 --json status,conclusion,databaseId \
              --jq '.[0]')

            STATUS=$(echo "$RUN" | jq -r '.status')
            CONCLUSION=$(echo "$RUN" | jq -r '.conclusion')
            RUN_ID=$(echo "$RUN" | jq -r '.databaseId')

            echo "Attempt $i: run=$RUN_ID status=$STATUS conclusion=$CONCLUSION"

            if [ "$STATUS" = "completed" ]; then
              if [ "$CONCLUSION" = "success" ]; then
                echo "Release succeeded ✓"
                break
              else
                echo "::error::Release failed with conclusion=$CONCLUSION"
                echo "Check: https://github.com/${{ github.repository }}/actions/runs/$RUN_ID"
                exit 1
              fi
            fi
            sleep 15
          done

          if [ "$STATUS" != "completed" ]; then
            echo "::error::Release did not complete within 10 minutes"
            exit 1
          fi

      - name: Trigger LinkedIn post
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        run: |
          echo "Dispatching LinkedIn Post..."
          gh workflow run linkedin-post.yml --repo ${{ github.repository }}
          echo "LinkedIn post dispatched ✓"

      - name: Summary
        run: |
          echo "============================================"
          echo "  EMERGENCY RELEASE COMPLETE"
          echo "============================================"
          echo "  Release: ✅ Triggered and succeeded"
          echo "  LinkedIn: ✅ Dispatched"
          echo "============================================"
