# Scheduled Release — Demystifying AI series
#
# Primary schedule: Mon/Wed/Sat at 00:05 IST
#   Cron: 35 18 * * 0,2,5  (Sun/Tue/Fri 18:35 UTC)
#
# Backup catch-up: daily at 06:05 IST (if primary run missed)
#   Cron: 35 0 * * *  (00:35 UTC)
#
# Date gating uses Asia/Kolkata (IST), not UTC.
# An episode with release_date 2026-08-31 releases when IST date >= 2026-08-31.
#
# LinkedIn posts are handled separately by linkedin-post.yml at 11:00 AM IST.

name: Scheduled Release

on:
  schedule:
    # Primary: Sun/Tue/Fri 18:35 UTC = Mon/Wed/Sat 00:05 IST
    - cron: '35 18 * * 0,2,5'
    # Backup catch-up: daily 00:35 UTC = 06:05 IST
    - cron: '35 0 * * *'
  workflow_dispatch:
    inputs:
      force:
        description: 'Release pending episode even if release_date is in the future'
        required: false
        default: 'false'
        type: boolean

permissions:
  contents: write
  issues: write

jobs:
  release:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout staging
        uses: actions/checkout@v4
        with:
          fetch-depth: 0

      - name: Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version: '20'

      - name: Configure git
        run: |
          git config user.name "mimran-khan"
          git config user.email "mimran-khan@users.noreply.github.com"
          git fetch origin --prune

      - name: Find next due pending episode
        id: find
        env:
          FORCE_RELEASE: ${{ github.event_name == 'workflow_dispatch' && inputs.force }}
        run: |
          TODAY_IST=$(TZ=Asia/Kolkata date +'%Y-%m-%d')
          echo "Today (IST): $TODAY_IST"
          echo "today_ist=$TODAY_IST" >> "$GITHUB_OUTPUT"

          if [ "$FORCE_RELEASE" = "true" ]; then
            BRANCH=$(jq -r '.episodes[] | select(.status == "pending") | .branch' manifest.json | head -1)
          else
            BRANCH=$(jq -r --arg t "$TODAY_IST" \
              '.episodes[] | select(.status == "pending" and ((.release_date // "9999-12-31") <= $t)) | .branch' \
              manifest.json | head -1)
          fi

          if [ -z "$BRANCH" ] || [ "$BRANCH" = "null" ]; then
            PENDING=$(jq -r '.episodes[] | select(.status == "pending") | .ep' manifest.json | head -1)
            if [ -n "$PENDING" ] && [ "$PENDING" != "null" ]; then
              NEXT_DATE=$(jq -r --argjson ep "$PENDING" '.episodes[] | select(.ep == $ep) | .release_date // "unknown"' manifest.json)
              echo "Pending episode EP$PENDING is not due yet (release_date=$NEXT_DATE, today_IST=$TODAY_IST). Skipping."
            else
              echo "No pending episodes in manifest. Nothing to release."
            fi
            echo "skip=true" >> "$GITHUB_OUTPUT"
            exit 0
          fi

          EP=$(jq -r --arg b "$BRANCH" '.episodes[] | select(.branch == $b) | .ep' manifest.json)
          TITLE=$(jq -r --arg b "$BRANCH" '.episodes[] | select(.branch == $b) | .title' manifest.json)
          SLUG=$(jq -r --arg b "$BRANCH" '.episodes[] | select(.branch == $b) | .slug' manifest.json)
          RELEASE_DATE=$(jq -r --arg b "$BRANCH" '.episodes[] | select(.branch == $b) | .release_date // "unknown"' manifest.json)

          echo "Found due pending episode: ep$EP - $TITLE (branch: $BRANCH, release_date: $RELEASE_DATE)"
          echo "branch=$BRANCH" >> "$GITHUB_OUTPUT"
          echo "ep=$EP" >> "$GITHUB_OUTPUT"
          echo "title=$TITLE" >> "$GITHUB_OUTPUT"
          echo "slug=$SLUG" >> "$GITHUB_OUTPUT"
          echo "skip=false" >> "$GITHUB_OUTPUT"

          if ! git rev-parse "origin/$BRANCH" >/dev/null 2>&1; then
            echo "::error::Branch '$BRANCH' listed in manifest but does not exist on remote"
            exit 1
          fi

      - name: Alert on missed releases
        if: steps.find.outputs.skip == 'true'
        uses: actions/github-script@v7
        with:
          script: |
            const fs = require('fs');
            const manifest = JSON.parse(fs.readFileSync('manifest.json', 'utf-8'));
            const todayIst = '${{ steps.find.outputs.today_ist }}';

            const overdue = manifest.episodes.filter(
              e => e.status === 'pending' &&
                   (e.release_date || '9999-12-31') <= todayIst
            );

            if (overdue.length === 0) return;

            const runUrl = `${context.serverUrl}/${context.repo.owner}/${context.repo.repo}/actions/runs/${context.runId}`;
            const epList = overdue.map(e =>
              `- **EP${e.ep}** (${e.slug}): release_date=${e.release_date}, status=${e.status}`
            ).join('\n');

            const title = `⚠️ Missed release — EP${overdue[0].ep} overdue (IST ${todayIst})`;
            const body = [
              '## Pending episode was not released',
              '',
              'A pending episode has `release_date <= today (IST)` but was not published.',
              '',
              epList,
              '',
              `- **Today (IST):** ${todayIst}`,
              `- **Workflow run:** ${runUrl}`,
              '',
              '### Recovery',
              '1. Check the episode branch for pre-flight failures (missing files, stale directories)',
              '2. Fix issues and re-run **Scheduled Release** from Actions',
              '3. The backup cron at 06:05 IST will also retry automatically',
            ].join('\n');

            const existing = await github.rest.issues.listForRepo({
              owner: context.repo.owner,
              repo: context.repo.repo,
              state: 'open',
              labels: 'missed-release',
              per_page: 10,
            });

            const duplicate = existing.data.find(issue =>
              issue.title.includes(`EP${overdue[0].ep}`) && issue.title.includes('overdue')
            );

            if (duplicate) {
              await github.rest.issues.createComment({
                owner: context.repo.owner,
                repo: context.repo.repo,
                issue_number: duplicate.number,
                body: `Still overdue as of IST ${todayIst}: ${runUrl}`,
              });
              return;
            }

            await github.rest.issues.create({
              owner: context.repo.owner,
              repo: context.repo.repo,
              title,
              body,
              labels: ['missed-release', 'automation'],
            });

      - name: Pre-flight validation
        if: steps.find.outputs.skip != 'true'
        run: |
          BRANCH="${{ steps.find.outputs.branch }}"
          SLUG="${{ steps.find.outputs.slug }}"
          EP="${{ steps.find.outputs.ep }}"
          ERRORS=0

          echo "::group::Pre-flight checks for $BRANCH (ep$EP - $SLUG)"

          if ! git rev-parse "origin/$BRANCH" >/dev/null 2>&1; then
            echo "::error title=Branch Missing::Branch '$BRANCH' does not exist on remote"
            ERRORS=$((ERRORS + 1))
          else
            echo "✓ Branch '$BRANCH' exists"
          fi

          ASTRO_PATH="src/pages/series/demystifying-ai/$SLUG.astro"
          if ! git show "origin/$BRANCH:$ASTRO_PATH" >/dev/null 2>&1; then
            echo "::error title=Missing Astro File::$ASTRO_PATH not found on branch '$BRANCH'"
            ERRORS=$((ERRORS + 1))
          else
            echo "✓ $ASTRO_PATH exists on $BRANCH"
          fi

          if ! git show "origin/$BRANCH:src/data/episodes.json" >/dev/null 2>&1; then
            echo "::error title=Missing episodes.json::src/data/episodes.json not found on branch '$BRANCH'"
            ERRORS=$((ERRORS + 1))
          else
            echo "✓ episodes.json exists on $BRANCH"
          fi

          HERO_PATH="public/series/ep$(printf '%02d' $EP)-$SLUG.png"
          if ! git show "origin/$BRANCH:$HERO_PATH" >/dev/null 2>&1; then
            echo "::error title=Missing Hero Image::$HERO_PATH not found on branch '$BRANCH'"
            ERRORS=$((ERRORS + 1))
          else
            echo "✓ Hero image exists on $BRANCH"
          fi

          OG_PATH="public/og-series-ep$(printf '%02d' $EP)-$SLUG.png"
          if ! git show "origin/$BRANCH:$OG_PATH" >/dev/null 2>&1; then
            echo "::error title=Missing OG Image::$OG_PATH not found on branch '$BRANCH'"
            ERRORS=$((ERRORS + 1))
          else
            echo "✓ OG image exists on $BRANCH"
          fi

          if git ls-tree -r --name-only "origin/$BRANCH" | grep -q '^articles/'; then
            echo "::error title=Stale Directory::Branch '$BRANCH' contains an articles/ directory. Files must be at src/pages/series/demystifying-ai/"
            ERRORS=$((ERRORS + 1))
          else
            echo "✓ No stale articles/ directory on $BRANCH"
          fi

          if git ls-tree -r --name-only "origin/$BRANCH" | grep -q '^images/'; then
            echo "::error title=Stale Directory::Branch '$BRANCH' contains an images/ directory. Files must be at public/series/ and public/og-series-*"
            ERRORS=$((ERRORS + 1))
          else
            echo "✓ No stale images/ directory on $BRANCH"
          fi

          echo "::endgroup::"

          if [ $ERRORS -gt 0 ]; then
            echo "::error::Pre-flight failed with $ERRORS error(s). Fix the branch before the next scheduled run."
            exit 1
          fi
          echo "All pre-flight checks passed ✓"

      - name: Rebase episode branch onto main
        if: steps.find.outputs.skip != 'true'
        run: |
          BRANCH="${{ steps.find.outputs.branch }}"
          echo "Rebasing $BRANCH onto main to avoid merge conflicts..."
          git checkout "$BRANCH"
          git rebase origin/main || {
            echo "Rebase had conflicts, resolving episodes.json with main's version..."
            git checkout --theirs src/data/episodes.json 2>/dev/null || true
            git add src/data/episodes.json
            GIT_EDITOR=true git rebase --continue || true
          }
          git checkout main

      - name: Merge episode into main
        if: steps.find.outputs.skip != 'true'
        run: |
          BRANCH="${{ steps.find.outputs.branch }}"
          git merge "$BRANCH" --no-edit -m "release: Episode ${{ steps.find.outputs.ep }} - ${{ steps.find.outputs.title }}" || {
            echo "Merge conflict detected. Auto-resolving episodes.json..."
            if git diff --name-only --diff-filter=U | grep -q 'src/data/episodes.json'; then
              git checkout --theirs src/data/episodes.json
              git add src/data/episodes.json
            fi
            git -c core.editor=true merge --continue
          }

      - name: Post-merge validation
        if: steps.find.outputs.skip != 'true'
        run: |
          SLUG="${{ steps.find.outputs.slug }}"
          EP="${{ steps.find.outputs.ep }}"
          ERRORS=0

          echo "::group::Post-merge validation"

          ASTRO_PATH="src/pages/series/demystifying-ai/$SLUG.astro"
          if [ ! -f "$ASTRO_PATH" ]; then
            echo "::error title=Missing Astro::$ASTRO_PATH missing after merge"
            ERRORS=$((ERRORS + 1))
          else
            echo "✓ $ASTRO_PATH present"
          fi

          if [ -d "articles" ]; then
            echo "::error title=Stale articles/::articles/ directory found after merge - would break public build"
            ls -la articles/
            ERRORS=$((ERRORS + 1))
          else
            echo "✓ No articles/ directory"
          fi

          if [ -d "images" ]; then
            echo "::error title=Stale images/::images/ directory found after merge - would leak into public repo"
            ls -la images/
            ERRORS=$((ERRORS + 1))
          else
            echo "✓ No images/ directory"
          fi

          HERO_PATH="public/series/ep$(printf '%02d' $EP)-$SLUG.png"
          if [ ! -f "$HERO_PATH" ]; then
            echo "::error title=Missing Hero::$HERO_PATH missing after merge"
            ERRORS=$((ERRORS + 1))
          else
            echo "✓ Hero image present at $HERO_PATH"
          fi

          OG_PATH="public/og-series-ep$(printf '%02d' $EP)-$SLUG.png"
          if [ ! -f "$OG_PATH" ]; then
            echo "::error title=Missing OG::$OG_PATH missing after merge"
            ERRORS=$((ERRORS + 1))
          else
            echo "✓ OG image present at $OG_PATH"
          fi

          if [ ! -f "src/data/episodes.json" ]; then
            echo "::error title=Missing episodes.json::src/data/episodes.json missing after merge"
            ERRORS=$((ERRORS + 1))
          else
            echo "✓ episodes.json present"
          fi

          echo "::endgroup::"

          if [ $ERRORS -gt 0 ]; then
            echo "::error::Post-merge validation failed with $ERRORS error(s). Aborting release."
            exit 1
          fi
          echo "Post-merge validation passed ✓"

      - name: Reconcile episodes.json published states
        if: steps.find.outputs.skip != 'true'
        run: |
          EP_NUM=${{ steps.find.outputs.ep }}
          node -e "
            const fs = require('fs');
            const eps = JSON.parse(fs.readFileSync('src/data/episodes.json', 'utf-8'));

            const manifest = JSON.parse(fs.readFileSync('manifest.json', 'utf-8'));
            const publishedEps = new Set(
              manifest.episodes
                .filter(e => e.status === 'published')
                .map(e => e.ep)
            );

            eps.forEach(e => {
              if (publishedEps.has(e.number) || e.number === ${EP_NUM}) {
                e.published = true;
              }
            });

            fs.writeFileSync('src/data/episodes.json', JSON.stringify(eps, null, 2) + '\n');
            console.log('Reconciled episodes.json - all published episodes preserved');
          "
          git add src/data/episodes.json

      - name: Regenerate sitemap
        if: steps.find.outputs.skip != 'true'
        run: |
          node scripts/generate-sitemap.mjs
          git add public/sitemap.xml

      - name: Update manifest
        if: steps.find.outputs.skip != 'true'
        run: |
          TODAY_IST=$(TZ=Asia/Kolkata date +'%Y-%m-%d')
          TAG="release/ep$(printf '%02d' ${{ steps.find.outputs.ep }})"
          jq --arg b "${{ steps.find.outputs.branch }}" \
             --arg d "$TODAY_IST" \
             --arg t "$TAG" \
             '(.episodes[] | select(.branch == $b)) |= . + {"status": "published", "published_on": $d, "tag": $t}' \
             manifest.json > manifest.tmp && mv manifest.tmp manifest.json

          NEXT=$(jq -r '[.episodes[] | select(.status == "queued")] | .[0].branch // empty' manifest.json)
          if [ -n "$NEXT" ]; then
            jq --arg b "$NEXT" \
               '(.episodes[] | select(.branch == $b)) |= . + {"status": "pending"}' \
               manifest.json > manifest.tmp && mv manifest.tmp manifest.json
            echo "Promoted $NEXT to pending"
          fi

          git add manifest.json
          git commit -m "chore: mark ep${{ steps.find.outputs.ep }} as published"

      - name: Tag release
        if: steps.find.outputs.skip != 'true'
        run: |
          TAG="release/ep$(printf '%02d' ${{ steps.find.outputs.ep }})"
          TODAY_IST=$(TZ=Asia/Kolkata date +'%Y-%m-%d')
          git tag -a "$TAG" -m "Release Episode ${{ steps.find.outputs.ep }}: ${{ steps.find.outputs.title }} ($TODAY_IST IST)"

      - name: Push main, tag, and delete episode branch
        if: steps.find.outputs.skip != 'true'
        run: |
          git push origin main --tags
          git push origin --delete "${{ steps.find.outputs.branch }}"

      - name: Prepare public repo push
        if: steps.find.outputs.skip != 'true'
        run: |
          git config --unset-all http.https://github.com/.extraheader || true
          git checkout -b release-clean

          git rm -f .github/workflows/scheduled-release.yml .github/workflows/linkedin-post.yml manifest.json

          git rm -rf articles/ 2>/dev/null || true
          git rm -rf images/ 2>/dev/null || true

          node -e "
            const fs = require('fs');
            const eps = JSON.parse(fs.readFileSync('src/data/episodes.json', 'utf-8'));
            const firstUnpublished = eps.findIndex(e => !e.published);
            const keepUpTo = firstUnpublished >= 0 ? firstUnpublished + 1 : eps.length;
            const filtered = eps.slice(0, keepUpTo);
            fs.writeFileSync('src/data/episodes.json', JSON.stringify(filtered, null, 2) + '\n');
            console.log('Public episodes.json: ' + filtered.length + ' entries (leaked: 0)');
          "
          git add src/data/episodes.json
          git commit -m "release: Episode ${{ steps.find.outputs.ep }} - ${{ steps.find.outputs.title }}"

      - name: Pre-push build validation
        if: steps.find.outputs.skip != 'true'
        run: |
          echo "Installing dependencies and running Astro build to verify site integrity..."
          npm ci
          npx astro build 2>&1 || {
            echo "::error::Astro build failed! Aborting push to public repo."
            exit 1
          }
          echo "Astro build passed ✓ - safe to push"

      - name: Final safety check before push
        if: steps.find.outputs.skip != 'true'
        run: |
          ERRORS=0
          echo "::group::Final safety check on release-clean branch"

          if git ls-tree -r --name-only HEAD | grep -q '^articles/'; then
            echo "::error::articles/ directory found in release-clean tree!"
            ERRORS=$((ERRORS + 1))
          else
            echo "✓ No articles/ in release tree"
          fi

          if git ls-tree -r --name-only HEAD | grep -q '^images/'; then
            echo "::error::images/ directory found in release-clean tree!"
            ERRORS=$((ERRORS + 1))
          else
            echo "✓ No images/ in release tree"
          fi

          if git ls-tree -r --name-only HEAD | grep -q 'manifest.json'; then
            echo "::error::manifest.json found in release-clean tree!"
            ERRORS=$((ERRORS + 1))
          else
            echo "✓ manifest.json stripped"
          fi

          if git ls-tree -r --name-only HEAD | grep -q 'scheduled-release.yml'; then
            echo "::error::scheduled-release.yml found in release-clean tree!"
            ERRORS=$((ERRORS + 1))
          else
            echo "✓ scheduled-release.yml stripped"
          fi

          echo "::endgroup::"

          if [ $ERRORS -gt 0 ]; then
            echo "::error::Final safety check failed. Aborting push to public repo."
            exit 1
          fi
          echo "Final safety check passed ✓"

      - name: Push to public repo
        if: steps.find.outputs.skip != 'true'
        id: public_push
        run: |
          git remote add public "https://x-access-token:${{ secrets.PUBLIC_REPO_PAT }}@github.com/mimran-khan/mimran-khan.github.io.git"
          PUSH_SHA=$(git rev-parse HEAD)
          echo "sha=$PUSH_SHA" >> "$GITHUB_OUTPUT"
          git push public release-clean:main --force

      - name: Wait for GitHub Pages deploy
        if: steps.find.outputs.skip != 'true'
        env:
          GH_TOKEN: ${{ secrets.PUBLIC_REPO_PAT }}
        run: |
          SLUG="${{ steps.find.outputs.slug }}"
          PUSH_TIME=$(date -u +%Y-%m-%dT%H:%M:%SZ)
          echo "Waiting for public repo deploy workflow to succeed (up to 10 minutes)..."

          DEPLOY_OK=false
          for i in $(seq 1 20); do
            RUN_ID=$(gh api "repos/mimran-khan/mimran-khan.github.io/actions/runs?branch=main&event=push&per_page=5" \
              --jq ".workflow_runs[] | select(.created_at >= \"$PUSH_TIME\" or .head_sha == \"${{ steps.public_push.outputs.sha }}\") | select(.name == \"Deploy to GitHub Pages\" or .name == \"pages build and deployment\") | .id" \
              | head -1)

            if [ -n "$RUN_ID" ]; then
              CONCLUSION=$(gh api "repos/mimran-khan/mimran-khan.github.io/actions/runs/$RUN_ID" --jq .conclusion)
              STATUS=$(gh api "repos/mimran-khan/mimran-khan.github.io/actions/runs/$RUN_ID" --jq .status)
              echo "Attempt $i: run $RUN_ID status=$STATUS conclusion=$CONCLUSION"

              if [ "$CONCLUSION" = "success" ]; then
                DEPLOY_OK=true
                break
              fi
              if [ "$CONCLUSION" = "failure" ] || [ "$CONCLUSION" = "cancelled" ]; then
                echo "::error::Public repo deploy workflow $RUN_ID ended with: $CONCLUSION"
                gh run view "$RUN_ID" --repo mimran-khan/mimran-khan.github.io --log-failed || true
                exit 1
              fi
            else
              echo "Attempt $i: deploy workflow not started yet..."
            fi
            sleep 30
          done

          if [ "$DEPLOY_OK" != "true" ]; then
            echo "::error::Timed out waiting for GitHub Pages deploy workflow to succeed"
            exit 1
          fi
          echo "GitHub Pages deploy workflow succeeded ✓"

      - name: Verify live site URL
        if: steps.find.outputs.skip != 'true'
        run: |
          SLUG="${{ steps.find.outputs.slug }}"
          URL="https://mimran-khan.github.io/series/demystifying-ai/${SLUG}"
          echo "Polling live URL: $URL (up to 10 minutes)"

          for i in $(seq 1 30); do
            STATUS=$(curl -s -o /dev/null -w "%{http_code}" "$URL")
            if [ "$STATUS" = "200" ]; then
              echo "Live site verified (HTTP 200) on attempt $i"
              exit 0
            fi
            echo "Attempt $i: HTTP $STATUS - waiting 20s..."
            sleep 20
          done

          echo "::error::Live URL $URL did not return HTTP 200 within 10 minutes"
          exit 1

  notify-failure:
    needs: release
    if: failure()
    runs-on: ubuntu-latest
    permissions:
      issues: write
    steps:
      - name: Create GitHub issue on release failure
        uses: actions/github-script@v7
        with:
          script: |
            const runUrl = `${context.serverUrl}/${context.repo.owner}/${context.repo.repo}/actions/runs/${context.runId}`;
            const todayIst = new Date().toLocaleDateString('en-CA', { timeZone: 'Asia/Kolkata' });
            const title = `🚨 Scheduled Release failed — IST ${todayIst}`;
            const body = [
              '## Scheduled Release pipeline failure',
              '',
              `- **Workflow run:** ${runUrl}`,
              `- **Triggered by:** ${context.eventName}`,
              `- **Time (UTC):** ${new Date().toISOString()}`,
              `- **Today (IST):** ${todayIst}`,
              '',
              'Check the failed job logs for the root cause. Common causes:',
              '- Pending episode branch missing on remote',
              '- Merge conflict in `src/data/episodes.json`',
              '- Stale `articles/` or `images/` directory on episode branch',
              '- Astro build failure on public repo push',
              '- GitHub Pages deploy did not complete',
              '',
              '### Recovery',
              '1. Fix the underlying issue on the episode branch',
              '2. Re-run **Scheduled Release** manually from Actions (use **force** only if release_date is still in the future)',
              '3. The backup cron at 06:05 IST will also auto-retry any overdue pending episode',
            ].join('\n');

            const existing = await github.rest.issues.listForRepo({
              owner: context.repo.owner,
              repo: context.repo.repo,
              state: 'open',
              labels: 'release-failure',
              per_page: 5,
            });

            const duplicate = existing.data.find(issue => issue.title === title);
            if (duplicate) {
              await github.rest.issues.createComment({
                owner: context.repo.owner,
                repo: context.repo.repo,
                issue_number: duplicate.number,
                body: `Another failure occurred: ${runUrl}`,
              });
              return;
            }

            await github.rest.issues.create({
              owner: context.repo.owner,
              repo: context.repo.repo,
              title,
              body,
              labels: ['release-failure', 'automation'],
            });
