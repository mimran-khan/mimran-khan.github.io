# LinkedIn Post — Demystifying AI series
#
# PRIMARY: dispatched automatically by scheduled-release after the article goes live at 11:00 AM IST.
#
# BACKUP: cron tries every hour from 12:00 PM to 4:30 PM IST on release days.
# If the release chain dispatch fails or GitHub drops a cron, the next hour catches it.
#
# DEDUP: checks manifest for linkedin_posted_on == today before posting.
# After posting, writes linkedin_posted_on to prevent repeats.
#
# TRIGGERS:
#   1. repository_dispatch (chained from scheduled-release — primary)
#   2. Cron (hourly backup on Mon/Wed/Sat afternoon)
#   3. workflow_dispatch (manual)

name: LinkedIn Post

on:
  schedule:
    # Backup: every hour from 06:30-11:00 UTC = 12:00-4:30 PM IST on Mon/Wed/Sat
    - cron: '30 6 * * 1,3,6'
    - cron: '30 7 * * 1,3,6'
    - cron: '30 8 * * 1,3,6'
    - cron: '30 9 * * 1,3,6'
    - cron: '30 10 * * 1,3,6'
    - cron: '30 11 * * 1,3,6'
  repository_dispatch:
    types: [linkedin-post]
  workflow_dispatch:

permissions:
  contents: write
  issues: write

jobs:
  post:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout staging
        uses: actions/checkout@v4

      - name: Gate — verify release workflow succeeded today
        id: gate
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        run: |
          TODAY_IST=$(TZ=Asia/Kolkata date +'%Y-%m-%d')
          echo "Checking if Scheduled Release succeeded today (IST $TODAY_IST)..."

          # Check if any episode was published today in the manifest
          PUBLISHED_TODAY=$(jq -r --arg t "$TODAY_IST" \
            '[.episodes[] | select(.status == "published" and .published_on == $t)] | length' \
            manifest.json)

          if [ "$PUBLISHED_TODAY" = "0" ]; then
            echo "No episode published today. Release has not run yet or did not succeed."
            echo "pass=false" >> "$GITHUB_OUTPUT"
            exit 0
          fi

          # Verify the article is actually live on GitHub Pages
          SLUG=$(jq -r --arg t "$TODAY_IST" \
            '.episodes[] | select(.status == "published" and .published_on == $t) | .slug' \
            manifest.json | tail -1)
          URL="https://mimran-khan.github.io/series/demystifying-ai/${SLUG}"
          STATUS=$(curl -s -o /dev/null -w "%{http_code}" "$URL")

          if [ "$STATUS" != "200" ]; then
            echo "Article $URL is not live yet (HTTP $STATUS). Release deploy may still be in progress."
            echo "pass=false" >> "$GITHUB_OUTPUT"
            exit 0
          fi

          echo "Gate passed: EP published today, article live (HTTP 200)"
          echo "pass=true" >> "$GITHUB_OUTPUT"

      - name: Find today's published episode
        if: steps.gate.outputs.pass == 'true'
        id: find
        run: |
          TODAY_IST=$(TZ=Asia/Kolkata date +'%Y-%m-%d')
          echo "Today (IST): $TODAY_IST"

          EP=$(jq -r --arg t "$TODAY_IST" \
            '.episodes[] | select(.status == "published" and .published_on == $t) | .ep' \
            manifest.json | tail -1)

          if [ -z "$EP" ] || [ "$EP" = "null" ]; then
            echo "No episode published today (IST $TODAY_IST). Skipping."
            echo "skip=true" >> "$GITHUB_OUTPUT"
            exit 0
          fi

          # DEDUP: check if already posted today
          ALREADY_POSTED=$(jq -r --argjson n "$EP" --arg t "$TODAY_IST" \
            '.episodes[] | select(.ep == $n) | .linkedin_posted_on // empty' \
            manifest.json)

          if [ "$ALREADY_POSTED" = "$TODAY_IST" ]; then
            echo "EP$EP already posted to LinkedIn on $TODAY_IST. Skipping (dedup)."
            echo "skip=true" >> "$GITHUB_OUTPUT"
            exit 0
          fi

          SLUG=$(jq -r --argjson n "$EP" '.episodes[] | select(.ep == $n) | .slug' manifest.json)
          POST_TEXT=$(jq -r --argjson n "$EP" '.episodes[] | select(.ep == $n) | .linkedin_post // empty' manifest.json)

          if [ -z "$POST_TEXT" ]; then
            echo "No linkedin_post text found for EP$EP. Skipping."
            echo "skip=true" >> "$GITHUB_OUTPUT"
            exit 0
          fi

          echo "Found EP$EP ($SLUG) published on $TODAY_IST — not yet posted to LinkedIn"
          echo "skip=false" >> "$GITHUB_OUTPUT"
          echo "ep=$EP" >> "$GITHUB_OUTPUT"
          echo "slug=$SLUG" >> "$GITHUB_OUTPUT"

          jq -r --argjson n "$EP" '.episodes[] | select(.ep == $n) | .linkedin_post' manifest.json > /tmp/post_text.txt

      - name: Verify site is deployed
        if: steps.find.outputs.skip != 'true'
        run: |
          SLUG="${{ steps.find.outputs.slug }}"
          URL="https://mimran-khan.github.io/series/demystifying-ai/${SLUG}"
          echo "Checking: $URL (up to 15 minutes)"

          for i in $(seq 1 30); do
            STATUS=$(curl -s -o /dev/null -w "%{http_code}" "$URL")
            if [ "$STATUS" = "200" ]; then
              echo "Site is live (HTTP 200) on attempt $i"
              exit 0
            fi
            echo "Attempt $i: HTTP $STATUS - waiting 30s..."
            sleep 30
          done

          echo "::error::Site not deployed after 30 attempts (15 minutes)."
          exit 1

      - name: Warm LinkedIn URL preview cache
        if: steps.find.outputs.skip != 'true'
        run: |
          SLUG="${{ steps.find.outputs.slug }}"
          EP_NUM=$(printf '%02d' ${{ steps.find.outputs.ep }})
          ARTICLE_URL="https://mimran-khan.github.io/series/demystifying-ai/${SLUG}"
          OG_IMAGE_URL="https://mimran-khan.github.io/og-series-ep${EP_NUM}-${SLUG}.png"

          echo "Pre-warming LinkedIn crawler cache..."
          echo "Article: $ARTICLE_URL"
          echo "OG Image: $OG_IMAGE_URL"

          curl -s -o /dev/null "https://www.linkedin.com/sharing/share-offsite/?url=$(python3 -c 'import urllib.parse; print(urllib.parse.quote("'"$ARTICLE_URL"'"))')"

          OG_STATUS=$(curl -s -o /dev/null -w "%{http_code}" "$OG_IMAGE_URL")
          echo "OG image status: HTTP $OG_STATUS"

          echo "Waiting 45s for LinkedIn to cache the preview..."
          sleep 45

      - name: Post to LinkedIn
        if: steps.find.outputs.skip != 'true'
        env:
          LINKEDIN_ACCESS_TOKEN: ${{ secrets.LINKEDIN_ACCESS_TOKEN }}
          LINKEDIN_PERSON_URN: ${{ secrets.LINKEDIN_PERSON_URN }}
        run: |
          SLUG="${{ steps.find.outputs.slug }}"
          EP_NUM=$(printf '%02d' ${{ steps.find.outputs.ep }})
          ARTICLE_URL="https://mimran-khan.github.io/series/demystifying-ai/${SLUG}"

          TITLE=$(jq -r --argjson n ${{ steps.find.outputs.ep }} \
            '.episodes[] | select(.ep == $n) | .title' manifest.json)

          DESCRIPTION=$(awk 'BEGIN{f=0} /^$/{if(f==0){f=1;next}} f==1&&/[a-zA-Z]/{print;f=2} f==2&&/^$/{exit} f==2{print}' /tmp/post_text.txt)
          if [ -z "$DESCRIPTION" ]; then
            DESCRIPTION="Demystifying AI in 5 Minutes. Built for engineers who ship."
          fi

          OG_IMAGE_URL="https://mimran-khan.github.io/og-series-ep${EP_NUM}-${SLUG}.png"

          jq -n \
            --arg author "$LINKEDIN_PERSON_URN" \
            --rawfile text /tmp/post_text.txt \
            --arg url "$ARTICLE_URL" \
            --arg title "$TITLE" \
            --arg desc "$DESCRIPTION" \
            --arg thumb "$OG_IMAGE_URL" \
            '{
              "author": $author,
              "lifecycleState": "PUBLISHED",
              "specificContent": {
                "com.linkedin.ugc.ShareContent": {
                  "shareCommentary": {"text": ($text | rtrimstr("\n"))},
                  "shareMediaCategory": "ARTICLE",
                  "media": [{
                    "status": "READY",
                    "originalUrl": $url,
                    "title": {"text": $title},
                    "description": {"text": $desc},
                    "thumbnails": [{"url": $thumb}]
                  }]
                }
              },
              "visibility": {
                "com.linkedin.ugc.MemberNetworkVisibility": "PUBLIC"
              }
            }' > /tmp/payload.json

          echo "--- Debug: text chars=$(wc -c < /tmp/post_text.txt | tr -d ' ') payload bytes=$(wc -c < /tmp/payload.json | tr -d ' ') ---"
          echo "--- Debug: commentary length=$(jq '.specificContent."com.linkedin.ugc.ShareContent".shareCommentary.text | length' /tmp/payload.json) ---"

          echo "Posting to LinkedIn (ugcPosts + ARTICLE)..."
          RESPONSE=$(curl -s -w "\n%{http_code}" -X POST \
            'https://api.linkedin.com/v2/ugcPosts' \
            -H "Authorization: Bearer $LINKEDIN_ACCESS_TOKEN" \
            -H 'Content-Type: application/json' \
            -H 'X-Restli-Protocol-Version: 2.0.0' \
            -d @/tmp/payload.json)

          HTTP_CODE=$(echo "$RESPONSE" | tail -1)
          BODY=$(echo "$RESPONSE" | sed '$d')

          if [ "$HTTP_CODE" = "201" ]; then
            echo "LinkedIn post published successfully!"
            echo "Response: $BODY"
            echo "posted=true" >> "$GITHUB_OUTPUT"
          else
            echo "::error::LinkedIn post failed with HTTP $HTTP_CODE"
            echo "$BODY"
            echo "posted=false" >> "$GITHUB_OUTPUT"
            exit 1
          fi

      - name: Mark linkedin_posted_on in manifest (dedup)
        if: steps.find.outputs.skip != 'true'
        run: |
          EP=${{ steps.find.outputs.ep }}
          TODAY_IST=$(TZ=Asia/Kolkata date +'%Y-%m-%d')

          git config user.name "mimran-khan"
          git config user.email "mimran-khan@users.noreply.github.com"

          git pull origin main --rebase || true

          jq --argjson n "$EP" --arg d "$TODAY_IST" \
            '(.episodes[] | select(.ep == $n)) += {"linkedin_posted_on": $d}' \
            manifest.json > manifest.tmp && mv manifest.tmp manifest.json

          git add manifest.json
          git commit -m "chore: mark ep${EP} linkedin posted on ${TODAY_IST}" || echo "No changes to commit"
          git push origin main || echo "Push failed (non-critical)"

  notify-failure:
    needs: post
    if: failure()
    runs-on: ubuntu-latest
    permissions:
      issues: write
    steps:
      - name: Create GitHub issue on LinkedIn failure
        uses: actions/github-script@v7
        with:
          script: |
            const runUrl = `${context.serverUrl}/${context.repo.owner}/${context.repo.repo}/actions/runs/${context.runId}`;
            const todayIst = new Date().toLocaleDateString('en-CA', { timeZone: 'Asia/Kolkata' });
            const title = `🚨 LinkedIn Post failed — IST ${todayIst}`;
            const body = [
              '## LinkedIn Post pipeline failure',
              '',
              `- **Workflow run:** ${runUrl}`,
              `- **Triggered by:** ${context.eventName}`,
              `- **Today (IST):** ${todayIst}`,
              '',
              'Common causes:',
              '- Site not live yet (GitHub Pages deploy still running or failed)',
              '- Missing `linkedin_post` text in manifest',
              '- LinkedIn API token expired or rate limited',
              '',
              '### Recovery',
              '1. Confirm the episode page returns HTTP 200',
              '2. Re-run **LinkedIn Post** manually from Actions',
            ].join('\n');

            await github.rest.issues.create({
              owner: context.repo.owner,
              repo: context.repo.repo,
              title,
              body,
              labels: ['linkedin-failure', 'automation'],
            });
