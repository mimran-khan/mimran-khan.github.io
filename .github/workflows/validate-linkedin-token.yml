# Temporary one-shot check. Does NOT post to LinkedIn.
name: Validate LinkedIn Token

on:
  workflow_dispatch:

permissions:
  contents: read

jobs:
  validate:
    runs-on: ubuntu-latest
    steps:
      - name: Check LinkedIn access token
        env:
          LINKEDIN_ACCESS_TOKEN: ${{ secrets.LINKEDIN_ACCESS_TOKEN }}
          LINKEDIN_PERSON_URN: ${{ secrets.LINKEDIN_PERSON_URN }}
        run: |
          if [ -z "$LINKEDIN_ACCESS_TOKEN" ]; then
            echo "::error::LINKEDIN_ACCESS_TOKEN secret is empty"
            exit 1
          fi
          if [ -z "$LINKEDIN_PERSON_URN" ]; then
            echo "::error::LINKEDIN_PERSON_URN secret is empty"
            exit 1
          fi

          echo "Token length: ${#LINKEDIN_ACCESS_TOKEN}"
          echo "Person URN set: yes (${#LINKEDIN_PERSON_URN} chars)"

          echo "--- Trying OpenID userinfo ---"
          RESP=$(curl -s -w "\n%{http_code}" \
            -H "Authorization: Bearer $LINKEDIN_ACCESS_TOKEN" \
            "https://api.linkedin.com/v2/userinfo")
          CODE=$(echo "$RESP" | tail -1)
          BODY=$(echo "$RESP" | sed '$d')
          echo "HTTP $CODE"
          echo "$BODY" | head -c 500
          echo

          echo "--- Trying /v2/me ---"
          RESP2=$(curl -s -w "\n%{http_code}" \
            -H "Authorization: Bearer $LINKEDIN_ACCESS_TOKEN" \
            "https://api.linkedin.com/v2/me")
          CODE2=$(echo "$RESP2" | tail -1)
          BODY2=$(echo "$RESP2" | sed '$d')
          echo "HTTP $CODE2"
          echo "$BODY2" | head -c 500
          echo

          # 401 = expired/invalid (the failure mode that broke EP55+)
          if echo "$BODY$BODY2" | grep -q "EXPIRED_ACCESS_TOKEN"; then
            echo "::error::Token is still EXPIRED"
            exit 1
          fi
          if [ "$CODE" = "401" ] || [ "$CODE2" = "401" ]; then
            echo "::error::Token rejected with HTTP 401 (invalid/expired)"
            exit 1
          fi

          # 200 = full profile scopes; 403 ACCESS_DENIED = token accepted but
          # missing openid/profile scopes (common if only w_member_social selected)
          if [ "$CODE" = "200" ] || [ "$CODE2" = "200" ]; then
            echo "VALID: token accepted (profile endpoint 200)"
            exit 0
          fi

          if [ "$CODE" = "403" ] || [ "$CODE2" = "403" ]; then
            echo "VALID: token is NOT expired. LinkedIn accepted the bearer token."
            echo "Profile endpoints returned 403 (missing openid/profile scopes)."
            echo "That is OK for ugcPosts if the token was minted with w_member_social."
            exit 0
          fi

          echo "::error::Unexpected response (userinfo=$CODE, me=$CODE2)"
          exit 1
